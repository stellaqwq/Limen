<div class="app" id="app">
  <aside class="side" id="side" aria-label="主导航">
    <div class="side-head">
      <a class="brand" href="#/config/ai" aria-label="Limen，配置文件">Limen</a>
      <button class="icon-btn side-close" id="side-close" aria-label="关闭导航"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>

    <button class="profile-chip" id="profile-chip" aria-haspopup="dialog" title="当前账号与连接">
      <span class="p-dot" id="profile-dot" data-state="idle"></span>
      <span class="p-text"><b id="profile-name">未登录</b><small id="profile-note">正在读取连接状态…</small></span>
      <svg class="ic p-chevron"><use href="#i-chevron"/></svg>
    </button>

    <div class="side-scroll">
      <nav class="nav" id="nav" aria-label="主要导航"></nav>
    </div>

    <div class="side-foot">
      <div class="side-status"><span class="dot" id="side-dot" data-state="idle"></span><span class="mono" id="side-version">—</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn side-open" id="side-open" aria-label="打开导航" aria-expanded="false"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <div class="topbar-right">
        <button class="search-trigger" id="search-open" aria-label="搜索页面与配置项，快捷键 Ctrl K">
          <svg class="ic"><use href="#i-search"/></svg>
          <span>搜索页面与配置…</span>
          <kbd>Ctrl K</kbd>
        </button>
        <button class="icon-btn" id="refresh" aria-label="重新读取当前数据"><svg class="ic"><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="theme-toggle" aria-label="切换明暗主题"><svg class="ic"><use href="#i-moon"/></svg></button>
        <span class="topbar-sep" aria-hidden="true"></span>
        <button class="avatar-btn" id="account-btn" aria-label="账号与连接">
          <span class="avatar" aria-hidden="true" id="account-initial">—</span>
          <span class="avatar-text"><b id="account-name">未登录</b><small id="account-driver">QQ 内核</small></span>
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<button class="scrim" id="scrim" aria-label="关闭浮层" hidden></button>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<aside class="drawer" id="drawer" aria-label="详情" hidden>
  <div class="drawer-head">
    <div><p class="drawer-kicker" id="drawer-kicker"></p><h2 id="drawer-title"></h2></div>
    <button class="icon-btn" id="drawer-close" aria-label="关闭详情"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">标题</h2>
      <button class="icon-btn" data-act="close-modal" aria-label="关闭"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="palette" id="palette" hidden>
  <div class="palette-card" role="dialog" aria-modal="true" aria-label="全局搜索">
    <div class="palette-input">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="palette-input" type="search" placeholder="搜索页面、配置项、插件…" autocomplete="off" aria-label="搜索">
      <kbd>ESC</kbd>
    </div>
    <ul class="palette-list" id="palette-list" role="listbox" aria-label="搜索结果"></ul>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>↵</kbd> 打开</span></div>
  </div>
</div>

<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
